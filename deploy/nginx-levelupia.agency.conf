# /etc/nginx/sites-available/levelupia.agency
# LevelUp AI (levelup-ai) — proxy vers l'application Next.js (PM2, port 3001)
#
# Version HTTP seule : c'est celle qu'il faut en place AVANT de lancer certbot.
# Certbot ajoutera lui-même le bloc HTTPS (listen 443 ssl) et la redirection.
#
# NOTE : le port est 3001, pas 3000. Le projet platfomelevelup occupe déjà
# 3000 sous levelupia.app ; les deux applications tournent en parallèle.

server {
    listen 80;
    listen [::]:80;
    server_name levelupia.agency www.levelupia.agency;

    # livrables jusqu'à 100 Mo côté application
    client_max_body_size 110M;

    # validation Let's Encrypt (certbot) : doit rester accessible en HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # indispensables : sans eux les redirections repartent vers localhost
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
    }
}
